# Dev orchestration: MySQL + the isolated Piston judge sandbox.
# The backend and frontend run on the host (npm run dev) during development.
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: learning_platform
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Sandboxed code execution for the 4 coding tracks.
  # Isolated from the backend network-wise except for the API port.
  piston:
    image: ghcr.io/engineer-man/piston:latest
    restart: unless-stopped
    privileged: true          # required for Piston's nsjail isolation
    ports:
      - "2000:2000"
    # Docker Desktop's embedded resolver can hand back NAT64 AAAA-only records
    # that don't route, breaking Piston's runtime downloads from GitHub. Pin
    # public IPv4 resolvers so package installs work.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - piston-packages:/piston/packages
    tmpfs:
      - /tmp:exec

volumes:
  mysql-data:
  piston-packages:
